# Production docker-compose for slskdarr.
#
# Unlike docker-compose.example.yml (which builds locally with `build: .`), this
# PULLS the pre-built image from the Gitea registry. That image is published by
# .gitea/workflows/deploy.yml on every v* tag (release.yml auto-tags main from
# conventional commits), tagged both :latest and :vX.Y.Z.
#
# slskdarr never touches the media files — it only hands Lidarr the completed-
# downloads path via its import API — so it needs NO media mount. Just config
# and network access to Lidarr/slskd/Postgres.
#
# State lives in PostgreSQL: point store.dsn in config.toml at the shared
# Postgres instance (this compose deliberately does NOT bundle one). slskdarr
# itself needs no data volume.
#
# --- Prerequisites ---
#   1. docker login gitea.shcizo.se        (registry auth; the package is private)
#   2. A config.toml next to this file      (copy config.example.toml, fill in
#      your Lidarr/slskd URLs + API keys and the Postgres store.dsn — all
#      reachable from the container, e.g. LAN IPs like
#      http://192.168.86.33:5030 or arr-network service names).
#
# --- Deploy / update ---
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# The image ships a HEALTHCHECK (see Dockerfile) that polls the reconcile
# loop's own liveness at /healthz, not just "is the process alive" — a hung
# HTTP/DB call inside a reconcile pass can otherwise wedge the loop forever
# without the process ever exiting. Both `docker compose` and `docker stack
# deploy` (Swarm) read this from the image automatically; Swarm reschedules a
# task once it's reported unhealthy for --retries consecutive checks.
#
# Pin a release with SLSKDARR_TAG=v1.2.3 (env or .env file); omit for :latest.
# The homelab package-updater-action redeploys automatically on new tags.

services:
  slskdarr:
    image: gitea.shcizo.se/shcizo/slskdarr:${SLSKDARR_TAG:-latest}
    container_name: slskdarr
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "se.shcizo.auto-update=true"

    # Non-root. Set to your arr-stack's user.
    user: "${PUID:-1000}:${PGID:-1000}"

    volumes:
      - ./config.toml:/config/config.toml:ro

    ports:
      # Status API (/status) + Prometheus (/metrics) — matches observ.listen_addr.
      - "9090:9090"

# --- Option: run inside your existing arr-stack network ---
# If slskd/lidarr are on a shared Docker network, attach slskdarr to it and use
# service-name URLs in config.toml (http://lidarr:8686, http://slskd:5030). Add
# `networks: [arr]` to the slskdarr service and declare the external network:
# networks:
#   arr:
#     external: true
