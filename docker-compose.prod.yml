# Production docker-compose for slusk.
#
# Unlike docker-compose.example.yml (which builds locally with `build: .`), this
# PULLS the pre-built image from the Gitea registry. That image is published by
# .gitea/workflows/deploy.yml on every v* tag (release.yml auto-tags main from
# conventional commits), tagged both :latest and :vX.Y.Z.
#
# slusk needs no media mount unless native Soulseek sharing is enabled.
# Mount only explicitly named share roots read-only and configure their
# in-container paths under [[soulseek.shared_folders]].
#
# State lives in PostgreSQL: point store.dsn in config.toml at the shared
# Postgres instance (this compose deliberately does NOT bundle one). slusk
# itself needs no data volume.
#
# --- Prerequisites ---
#   1. docker login gitea.shcizo.se        (registry auth; the package is private)
#   2. A config/config.toml next to this file (copy config.example.toml, fill in
#      your Lidarr/slskd URLs + API keys, Postgres store.dsn, and a long random
#      observ.auth_token — all upstream services must be reachable from the
#      container, e.g. LAN IPs like http://192.168.86.33:5030 or arr-network
#      service names). Keep config/config.toml out of source control and logs.
#
# --- Deploy / update ---
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# The image ships a HEALTHCHECK (see Dockerfile) that polls the reconcile
# loop's own liveness at /healthz, not just "is the process alive" — a hung
# HTTP/DB call inside a reconcile pass can otherwise wedge the loop forever
# without the process ever exiting. Both `docker compose` and `docker stack
# deploy` (Swarm) read this from the image automatically; Swarm reschedules a
# task once it's reported unhealthy for --retries consecutive checks.
#
# Pin a release with SLUSK_TAG=v1.2.3 (env or .env file); omit for :latest.
# The homelab package-updater-action redeploys automatically on new tags.
#
# --- Deploy (breaking): pipeline-state-machine rewrite ---
# This release replaces the old engine with internal/pipeline (states
# WANTED/SELECTING/DOWNLOADING/IMPORTING/DONE/CANCELLED/FAILED) and swaps
# candidate_attempts for a candidates table. There is no migration path for
# in-flight jobs — clean-slate the pipeline tables instead:
#   1. docker compose -f docker-compose.prod.yml stop slusk
#   2. Migrate config.toml: [engine] -> [pipeline]; drop lidarr.poll_interval
#      and slskd.status_poll_interval (both gone); rename
#      max_concurrent_active -> max_active (now lives under [pipeline]);
#      drop batch, candidate_backoff, failed_candidate_backoff,
#      failed_retry_after, tick_interval (no [pipeline] equivalent).
#   3. scripts/clean-slate-pipeline.sh "$DSN"   (wipes album_jobs/candidates/
#      candidate_attempts/transfers/job_events; keeps known_users and
#      artist_user_reliability peer history)
#   4. Manually clear slskd's downloads directory so leftover files from
#      orphaned transfers don't collide with fresh attempts.
#   5. docker compose -f docker-compose.prod.yml pull && ... up -d
#      (pin SLUSK_TAG to the new release if not using :latest)
# Every still-wanted album reappears as WANTED on the first WantedSync tick
# after startup, so nothing needs to be manually re-queued.

services:
  slusk:
    image: ghcr.io/hyzr-dev/slusk:${SLUSK_TAG:-latest}
    container_name: slusk
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "se.shcizo.auto-update=true"

    # Non-root. Set to your arr-stack's user.
    user: "${PUID:-1000}:${PGID:-1000}"

    volumes:
      # A writable directory mount is required for editing settings from the
      # UI (issue #89): slusk writes the updated config.toml back into
      # this directory, which needs an atomic rename to land safely, so a
      # single bind-mounted file cannot be modified this way. A read-only
      # single-file mount (./config.toml:/config/config.toml:ro) is still
      # supported and works exactly as before, but makes settings read-only
      # in the UI.
      - ./config:/config
      # Optional; the non-root PUID:PGID must have read permission.
      # - /host/music:/shares/music:ro

    ports:
      # /healthz is public for container/orchestrator probes. Every UI/API,
      # /status, and /metrics request requires observ.auth_token (Bearer for
      # clients; HTTP Basic password for browsers). Never put the token in a
      # URL/query. Terminate TLS at a trusted reverse proxy before exposing
      # this port outside a trusted private network.
      - "9090:9090"
      # Soulseek peer listener; uncomment when [soulseek] is enabled in
      # config.toml. The published host port MUST equal the container port
      # (soulseek.listen_addr's port), or use host networking instead - there
      # is no separate "advertised port" concept, so a mismatched mapping
      # would advertise a port peers can't actually reach.
      # - "2234:2234"

    # Rescan configured shares after filesystem changes without restarting:
    #   docker kill --signal=HUP slusk

# --- Option: run inside your existing arr-stack network ---
# If slskd/lidarr are on a shared Docker network, attach slusk to it and use
# service-name URLs in config.toml (http://lidarr:8686, http://slskd:5030). Add
# `networks: [arr]` to the slusk service and declare the external network:
# networks:
#   arr:
#     external: true
