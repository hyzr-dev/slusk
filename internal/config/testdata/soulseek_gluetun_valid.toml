[lidarr]
url = "http://lidarr:8686"
api_key = "abc"

[slskd]
url = "http://slskd:5030"
api_key = "def"

[pipeline]
max_candidates_per_album = 5
transfer_deadline = "30m"
stall_timeout = "5m"
search_timeout = "30s"
min_bitrate = 192
max_inflight_per_peer = 3
max_transfer_retries = 3

[pipeline.weights]
format = 1.0
bitrate = 0.5
reliability = 0.8
file_count = 1.0

[store]
dsn = "postgres://slusk:password@postgres:5432/slusk?sslmode=disable"

[observ]
listen_addr = "127.0.0.1:9090"

[paths]
slskd_complete_dir = "/music/slskd-downloads"

[soulseek]
username = "souluser"
password = "soulpass"
upload_slots = 4

[soulseek.gluetun]
control_url = "http://127.0.0.1:8000"
api_key = "gluetun-key"

[[soulseek.shared_folders]]
name = "Music"
path = "/shares/music"
