[lidarr]
url = "http://lidarr:8686"
api_key = "abc"

[slskd]
url = "http://slskd:5030"
api_key = "def"

[pipeline]
max_candidates_per_album = 5
transfer_deadline = "30m"
stall_timeout = "5m"
search_timeout = "30s"
min_bitrate = 192
max_inflight_per_peer = 3
max_transfer_retries = 3
max_active = 50
max_retries = 5
backoff_base = "10m"
backoff_cap = "12h"
candidate_ttl = "12h"
failed_revive_after = "360h"
stuck_after = "30m"
tick_timeout = "2m"
import_confirm_timeout = "4m"
wanted_sync_interval = "10m"
discovery_interval = "20s"
selecting_interval = "5s"
downloading_interval = "10s"
importing_interval = "20s"
manual_import_timeout = "8m"
import_retry_cooldown = "2m"

[pipeline.weights]
format = 1.0
bitrate = 0.5
reliability = 0.8
file_count = 1.0

[store]
dsn = "postgres://slusk:password@postgres:5432/slusk?sslmode=disable"

[observ]
listen_addr = "127.0.0.1:9090"

[paths]
slskd_complete_dir = "/music/slskd-downloads"
