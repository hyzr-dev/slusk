# docker-compose for slskdarr.
# With the default slskd backend, slskdarr needs no media mount. But with
# pipeline.backend = "soulseek" (the native backend) it downloads files itself
# and needs a WRITABLE volume at paths.slskd_complete_dir (see the mount below);
# the slskd backend only ever read that path.
# Named Soulseek shares are scanned and served read-only; mount only those roots
# and use their in-container paths in [[soulseek.shared_folders]].
#
# State lives in PostgreSQL (store.dsn in config.toml), so slskdarr itself needs
# no data volume. This example bundles a local Postgres for development; in
# production you would typically point store.dsn at a shared external instance
# instead (see docker-compose.prod.yml).

services:
  postgres:
    image: postgres:17-alpine
    container_name: slskdarr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: slskdarr
      POSTGRES_PASSWORD: password
      POSTGRES_DB: slskdarr
    volumes:
      - slskdarr-pgdata:/var/lib/postgresql/data

  slskdarr:
    build: .
    # ...or, if you build/pull separately: image: slskdarr:latest
    container_name: slskdarr
    restart: unless-stopped

    # Non-root. Set this to your usual arr PUID:PGID.
    user: "1000:1000"

    depends_on:
      - postgres

    volumes:
      - ./config.toml:/config/config.toml:ro
      # Required with pipeline.backend = "soulseek": the native backend writes
      # completed downloads here itself, so this must be WRITABLE by the
      # PUID:PGID above and match paths.slskd_complete_dir in config.toml. Share
      # it with Lidarr at the path Lidarr expects so import works end to end.
      # Not needed with the default slskd backend (which only reads that path).
      # - /host/downloads:/music/slskd-downloads
      # Optional named Soulseek share; keep it read-only and ensure the
      # configured non-root PUID:PGID can read every shared file.
      # - /host/music:/shares/music:ro

    ports:
      # Public: /healthz only. Dashboard, API, /status, and /metrics require the
      # [observ] auth_token from config.toml. Keep that file out of source
      # control and send the token in Authorization, never in a URL/query.
      # The host side is bound to loopback for local-only development. A TLS
      # reverse proxy may expose it, but must preserve Host and replace any
      # client X-Forwarded-Proto with exactly one trusted http/https value.
      - "127.0.0.1:9090:9090"
      # Soulseek peer listener; uncomment when [soulseek] is enabled in
      # config.toml. The published host port MUST equal the container port
      # (soulseek.listen_addr's port) - there is no separate "advertised
      # port" concept, so a mismatched mapping would advertise a port peers
      # can't actually reach.
      # - "2234:2234"

    # After changing share contents, atomically rescan without restarting:
    #   docker kill --signal=HUP slskdarr

volumes:
  slskdarr-pgdata:

# --- Option: run inside your existing arr-stack compose ---
# If slskd/lidarr are services in the SAME compose project, put slskdarr on their
# network and use service-name URLs in config.toml (http://lidarr:8686, etc.):
#   networks: [arr]
# The slskd service itself is optional when pipeline.backend = "soulseek" in
# config.toml: nothing in the pipeline talks to it in that mode, so it can be
# omitted from this compose project entirely (Lidarr's network access is
# still required).
# networks:
#   arr:
#     external: true
