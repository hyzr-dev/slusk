# docker-compose for slskdarr.
# slskdarr never touches the media files (it only passes the completed-downloads
# path to Lidarr's import API), so it needs NO media mount — just config + a small
# volume for its SQLite DB + network access to Lidarr/slskd.
#
# The DB lives in a NAMED VOLUME (not a host bind mount): bind mounts fail on
# Docker Desktop for Mac (virtiofs UID mapping), and a fresh named volume is
# root-owned. The init service below chowns the volume so slskdarr can run as a
# non-root UID. This works on both Docker Desktop and a Linux server.

services:
  # One-shot: make the data volume writable by the non-root slskdarr user, then exit.
  slskdarr-init:
    image: busybox
    command: chown -R 1000:1000 /data
    volumes:
      - slskdarr-data:/data

  slskdarr:
    build: .
    # ...or, if you build/pull separately: image: slskdarr:latest
    container_name: slskdarr
    restart: unless-stopped

    # Non-root. Set this to your usual arr PUID:PGID; must match the init chown above.
    user: "1000:1000"

    depends_on:
      slskdarr-init:
        condition: service_completed_successfully

    volumes:
      - ./config.toml:/config/config.toml:ro
      - slskdarr-data:/data

    ports:
      # Status API (/status) + Prometheus (/metrics) — matches observ.listen_addr.
      - "9090:9090"

volumes:
  slskdarr-data:

# --- Option: run inside your existing arr-stack compose ---
# If slskd/lidarr are services in the SAME compose project, put slskdarr on their
# network and use service-name URLs in config.toml (http://lidarr:8686, etc.):
#   networks: [arr]
# networks:
#   arr:
#     external: true
