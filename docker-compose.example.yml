# docker-compose for slusk — the one file to copy.
#
#   cp docker-compose.example.yml docker-compose.yml
#   cp config.example.toml config/config.toml   # then fill it in
#   docker compose up -d
#
# docker-compose.yml is gitignored, so your copy (and any local edits to it)
# stays out of the repo. Every deployment variant this project supports is a
# commented block at the bottom of this file: external Postgres, an existing
# arr network, gluetun with VPN port forwarding, and building from source.
#
# State lives in PostgreSQL, which this file bundles — slusk itself keeps no
# data volume, so it needs no writable state mount of its own.
#
# With the default slskd backend, slusk needs no media mount: it only hands
# Lidarr a path to import from. With pipeline.backend = "soulseek" (the native
# backend) it downloads the files itself and needs a WRITABLE volume at
# paths.slskd_complete_dir; the slskd backend only ever reads that path.
# Named Soulseek shares are scanned and served read-only; mount only those roots
# and use their in-container paths in [[soulseek.shared_folders]].

services:
  postgres:
    image: postgres:17-alpine
    container_name: slusk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: slusk
      POSTGRES_PASSWORD: password
      POSTGRES_DB: slusk
    volumes:
      - slusk-pgdata:/var/lib/postgresql/data
    # slusk exits non-zero if it cannot reach the database at startup, so
    # without this gate it crash-loops (harmlessly, but confusingly) until
    # Postgres finishes initialising on a first run.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slusk -d slusk"]
      interval: 5s
      timeout: 5s
      retries: 10

  slusk:
    image: ghcr.io/hyzr-dev/slusk:${SLUSK_TAG:-latest}
    # ...or build from this checkout instead: build: .
    container_name: slusk
    restart: unless-stopped

    # Non-root. Set this to your usual arr PUID:PGID.
    user: "${PUID:-1000}:${PGID:-1000}"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      # A writable DIRECTORY mount is required for editing settings from the
      # UI (issue #89): slusk writes the updated config.toml back into
      # this directory, which needs an atomic rename to land safely, so a
      # single bind-mounted file cannot be modified this way. A read-only
      # single-file mount (./config.toml:/config/config.toml:ro) is still
      # supported and works exactly as before, but makes settings read-only
      # in the UI. Either way the PUID:PGID above must be able to read it —
      # on Docker Desktop for Mac, bind-mount ownership does not always map
      # the way it does on Linux, so check this first if startup can't read
      # the config.
      - ./config:/config
      # Required with pipeline.backend = "soulseek": the native backend writes
      # completed downloads here itself, so this must be WRITABLE by the
      # PUID:PGID above and match paths.slskd_complete_dir in config.toml. Share
      # it with Lidarr at the path Lidarr expects so import works end to end.
      # Not needed with the default slskd backend (which only reads that path).
      # - /host/downloads:/music/slskd-downloads
      # Optional named Soulseek share; keep it read-only and ensure the
      # configured non-root PUID:PGID can read every shared file.
      # - /host/music:/shares/music:ro

    ports:
      # Public: /healthz, /readyz and the dashboard shell only. Every API,
      # /status and /metrics request needs either a browser session (the first
      # visit prompts to create the single account) or the [observ] auth_token
      # from config.toml. Keep that file out of source control and send the
      # token in Authorization, never in a URL/query.
      # The host side is bound to loopback here. A TLS reverse proxy may expose
      # it, but must preserve Host and replace any client X-Forwarded-Proto with
      # exactly one trusted http/https value.
      - "127.0.0.1:9090:9090"
      # Soulseek peer listener; uncomment when [soulseek] is enabled in
      # config.toml. The published host port MUST equal the container port
      # (soulseek.listen_addr's port) - there is no separate "advertised
      # port" concept, so a mismatched mapping would advertise a port peers
      # can't actually reach.
      # - "2234:2234"

    # The image ships a HEALTHCHECK (see Dockerfile) that polls the reconcile
    # loop's own liveness at /healthz, not just "is the process alive" — a hung
    # HTTP/DB call inside a reconcile pass can otherwise wedge the loop forever
    # without the process ever exiting. Both `docker compose` and `docker stack
    # deploy` (Swarm) read this from the image automatically; Swarm reschedules
    # a task once it's reported unhealthy for --retries consecutive checks.

    # After changing share contents, atomically rescan without restarting:
    #   docker kill --signal=HUP slusk

volumes:
  slusk-pgdata:

# --- Option: pin a release instead of tracking :latest ---
# SLUSK_TAG=v1.2.3 in the environment or a .env file next to this file. Images
# are published to ghcr.io/hyzr-dev/slusk on every v* tag, as :vX.Y.Z and
# :latest. To update:
#   docker compose pull && docker compose up -d

# --- Option: build from source instead of pulling ---
# Replace the `image:` line on the slusk service with `build: .` and run
# `docker compose up -d --build`. Needed on architectures the published image
# does not cover, or to run an unreleased checkout.

# --- Option: use an external Postgres ---
# If you already run a shared Postgres, delete the `postgres` service, the
# `depends_on` block, and the `slusk-pgdata` volume above, then point
# store.dsn in config.toml at that instance. The database and role must exist
# already; slusk creates and migrates its own schema on startup. This is the
# only variant where the compose file bundles no database.

# --- Option: run inside your existing arr-stack compose ---
# If slskd/lidarr are services in the SAME compose project, put slusk on their
# network and use service-name URLs in config.toml (http://lidarr:8686, etc.):
#   networks: [arr]
# The slskd service itself is optional when pipeline.backend = "soulseek" in
# config.toml: nothing in the pipeline talks to it in that mode, so it can be
# omitted from this compose project entirely (Lidarr's network access is
# still required).
# networks:
#   arr:
#     external: true

# --- Option: run behind gluetun with VPN port forwarding ---
# With soulseek.gluetun set in config.toml, slusk fetches its forwarded
# port from gluetun's control server at startup instead of using a static
# port. This requires slusk to share gluetun's network namespace (so it can
# reach the control server at 127.0.0.1 and receive inbound peer connections
# on the forwarded port), which means:
#   - remove slusk's own "ports:" section above; the port is published on
#     the gluetun service instead (below, 9090 for the observ endpoint - the
#     Soulseek peer port does not need publishing, gluetun forwards it).
#   - add network_mode: "service:gluetun" to the slusk service.
#   - soulseek.gluetun.control_url in config.toml is "http://127.0.0.1:8000"
#     (same network namespace as gluetun, so localhost reaches it).
#
# NOTE: network_mode: "service:<name>" is NOT supported by Docker Swarm - this
# option is for plain docker-compose only.
#
# services:
#   gluetun:
#     image: qmcgaw/gluetun
#     container_name: gluetun
#     cap_add:
#       - NET_ADMIN
#     devices:
#       - /dev/net/tun
#     environment:
#       VPN_SERVICE_PROVIDER: your-provider
#       VPN_TYPE: wireguard
#       VPN_PORT_FORWARDING: "on"
#     # gluetun >= v3.40 requires control-server auth config on ITS side for
#     # /v1/portforward - without it, slusk's fetch gets 401 forever. Mount
#     # a config granting the route to the same key as soulseek.gluetun.api_key:
#     #   volumes: [./gluetun-auth.toml:/gluetun/auth/config.toml:ro]
#     # with: [[roles]] name="slusk" routes=["GET /v1/portforward"]
#     #       auth="apikey" apikey="<same key>"
#     # (older gluetun: no auth needed, the api_key is simply unused)
#     ports:
#       - "127.0.0.1:9090:9090" # slusk's observ endpoint, published here
#
#   slusk:
#     network_mode: "service:gluetun"
#     depends_on:
#       - gluetun
#       - postgres
#     # ports: intentionally omitted - see gluetun's ports above

# --- Option: automatic redeploy on a new release ---
# The homelab deployment adds labels its updater watches, and opts out of
# watchtower so the two don't fight over the same container:
#   labels:
#     - "com.centurylinklabs.watchtower.enable=false"
#     - "se.shcizo.auto-update=true"
