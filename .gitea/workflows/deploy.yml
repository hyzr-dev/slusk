name: Build and deploy

# Triggered by a v* tag push (created by release.yml). Builds and pushes the
# image to the Gitea registry, then tells the homelab updater to redeploy it.

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to Gitea registry
        uses: docker/login-action@v3
        with:
          registry: gitea.shcizo.se
          username: ${{ gitea.actor }}
          password: ${{ secrets.PACKAGES_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Baked into the binary as main.version and reported at /status, so
          # the running container can say which release it is.
          build-args: |
            VERSION=${{ gitea.ref_name }}
          tags: |
            gitea.shcizo.se/shcizo/slusk:${{ gitea.ref_name }}
            gitea.shcizo.se/shcizo/slusk:latest

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    steps:
      - uses: https://gitea.shcizo.se/shcizo/package-updater-action@v1
        with:
          endpoint: https://updater.shcizo.se/update
          image: gitea.shcizo.se/shcizo/slusk
          tag: ${{ gitea.ref_name }}
          token: ${{ secrets.UPDATER_API_KEY }}
