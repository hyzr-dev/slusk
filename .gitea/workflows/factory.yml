# Starts software-factory jobs for this repo: run and release from issue events, resolve from a
# submitted review on a factory pull request, review from a factory pull request being opened
# or pushed to. Copy to .gitea/workflows/factory.yml.
# Needs user-level Actions secrets FACTORY_GITEA_TOKEN, FACTORY_CLAUDE_TOKEN and
# FACTORY_REGISTRY_TOKEN (shcizo's read:package token, only used to pull the images),
# FACTORY_REVIEW_TOKEN (factory-reviewer's token, only the runner gets it), the
# variable FACTORY_TAG (image tag; empty means latest) and a runner with label "factory".
# Optional: variable FACTORY_OBSERVE_URL (a variable, not a secret) and secret
# FACTORY_OBSERVE_TOKEN stream each run to the observe server; both empty means nothing is sent.
# Optional: variable FACTORY_IMAGE picks the agent image (e.g. software-factory-agent-dotnet for
# .NET repos); empty means the standard image. A repo variable wins over the user's.
# See the software-factory README, "Trigger".
name: Factory

on:
  issues:
    types: [labeled, closed]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, synchronize]

jobs:
  factory:
    # closed → factory release; a label change that leaves ready-for-ai on the issue →
    # factory run (which checks the label again itself). Gitea's payload calls a label
    # change "label_updated", not "labeled", so the action name is not compared.
    # A submitted review whose type ends in "rejected" (a Request changes review) →
    # factory resolve, which checks the review state, author and pull request itself.
    # A pull request by factory-bot from an ai/ branch, opened or pushed to → factory review,
    # which checks the pull request, its head commit and the earlier reviews itself.
    if: >-
      (github.event_name == 'issues' &&
      (github.event.action == 'closed' || contains(github.event.issue.labels.*.name, 'ready-for-ai'))) ||
      (github.event_name == 'pull_request_review' && endsWith(github.event.review.type, 'rejected')) ||
      (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'factory-bot' &&
      startsWith(github.event.pull_request.head.ref, 'ai/'))
    runs-on: factory
    container: docker:29-cli
    env:
      COMMAND: ${{ github.event_name == 'pull_request_review' && 'resolve' || github.event_name == 'pull_request' && 'review' || github.event.action == 'closed' && 'release' || 'run' }}
      REPO: ${{ github.repository }}
      # The issue number, or the pull request number for resolve and review (the failure step
      # comments on it).
      ISSUE: ${{ github.event.issue.number || github.event.pull_request.number }}
      GITEA_URL: ${{ github.server_url }}
      GITEA_TOKEN: ${{ secrets.FACTORY_GITEA_TOKEN }}
      # Gitea's run page is /actions/runs/<run id> (checked against an existing run's html_url).
      FACTORY_LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      FACTORY_OBSERVE_URL: ${{ vars.FACTORY_OBSERVE_URL }}
    steps:
      - name: factory ${{ github.event_name == 'pull_request_review' && 'resolve' || github.event_name == 'pull_request' && 'review' || github.event.action == 'closed' && 'release' || 'run' }}
        shell: sh
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.FACTORY_CLAUDE_TOKEN }}
          FACTORY_OBSERVE_TOKEN: ${{ secrets.FACTORY_OBSERVE_TOKEN }}
          # Reaches the runner only (compose.ci.yaml), never the agent.
          FACTORY_REVIEW_TOKEN: ${{ secrets.FACTORY_REVIEW_TOKEN }}
          # Not listed in compose.ci.yaml, so it never reaches the runner or the agent.
          REGISTRY_TOKEN: ${{ secrets.FACTORY_REGISTRY_TOKEN }}
          FACTORY_TAG: ${{ vars.FACTORY_TAG }}
          # Empty means the standard agent image. The runner checks the name; the agent never sees it.
          FACTORY_IMAGE: ${{ vars.FACTORY_IMAGE }}
          # Repo-specific settings go here; only PUPPETEER_SKIP_DOWNLOAD also reaches the agent:
          # PUPPETEER_SKIP_DOWNLOAD: "1"
        run: |
          set -eu
          printf '%s' "$REGISTRY_TOKEN" | docker login gitea.shcizo.se -u shcizo --password-stdin
          image="gitea.shcizo.se/shcizo/software-factory-runner:${FACTORY_TAG:-latest}"
          docker pull -q "$image"
          d="$(mktemp -d)"
          docker run --rm --entrypoint cat "$image" /opt/factory/compose.yaml > "$d/compose.yaml"
          docker run --rm --entrypoint cat "$image" /opt/factory/compose.ci.yaml > "$d/compose.ci.yaml"
          compose() { docker compose -f "$d/compose.yaml" -f "$d/compose.ci.yaml" "$@"; }
          # Pull the agent (the chosen variant) and proxy too, so a new release replaces an old :latest.
          compose pull -q
          # A cancelled earlier job leaves its containers and volumes; remove them on purpose
          # (-v drops the work, task and claude volumes). Safe only because the factory runner
          # runs one job at a time (deploy/runner-config.yaml).
          compose down -v
          trap 'compose down -v; rm -rf "$d"' EXIT
          compose run --rm -T runner "$COMMAND" "$REPO" "$ISSUE"

      # factory run reports its own failures on the issue (resolve and review: on the pull request). This covers what fails before or
      # around it (login, pull, compose, a missing runner image). It only comments: changing
      # labels here would be a new label event and start this workflow again.
      - name: report failure on the issue or pull request
        if: failure()
        shell: sh
        run: |
          wget -q -O /dev/null \
            --header "Authorization: token $GITEA_TOKEN" \
            --header "Content-Type: application/json" \
            --post-data "{\"body\":\"The factory job ($COMMAND) failed before the agent could report. Log: $FACTORY_LOG_URL. Re-run the job there once the cause is fixed.\"}" \
            "$GITEA_URL/api/v1/repos/$REPO/issues/$ISSUE/comments"
