name: CI

# Checks on every pull request into main. Merging to main auto-tags and deploys
# (see release.yml and deploy.yml), so this is the only gate that runs *before*
# a change reaches production.
#
# The jobs are split so a failure names itself: a red "image" job means the
# build chain broke, a red "go" job means the backend did. They run in parallel.
#
# Unlike the other two workflows this one pins Go and Node explicitly. Neither
# release.yml nor deploy.yml runs either toolchain on the runner — release only
# tags in git, and deploy builds inside the container — so there is no runner
# version to inherit conventions from, and go.mod requires a recent Go.

on:
  pull_request:
    branches:
      - main

# A force-push to a PR branch supersedes the previous run; don't pay for both.
concurrency:
  group: ci-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # internal/store, internal/pipeline and cmd/sqlite2pg each start an
      # embedded Postgres via internal/store/storetest — no service container is
      # needed, but the first run downloads the Postgres binaries. Caching them
      # keeps that cost to once per runner image rather than once per push.
      - name: Cache embedded Postgres binaries
        uses: actions/cache@v4
        with:
          path: ~/.embedded-postgres-go
          key: embedded-postgres-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            embedded-postgres-${{ runner.os }}-

      # gofmt -l prints offending files and exits 0 either way, so the file list
      # itself has to be the failure condition.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Matches the Dockerfile's node:22 so a green CI and a green image build
      # mean the same thing.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      # npm test is `node scripts/check-css-tokens.mjs && vitest run`, so this
      # covers the CSS-token check too.
      - name: Test
        working-directory: web
        run: npm test

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Builds the same Dockerfile deploy.yml ships, without pushing. This is
      # the step that would have caught #232: `npm run build` (and therefore
      # `tsc -b`) is only ever invoked from Dockerfile, so a type error in
      # vite.config.ts was green in `make test` and red only in the image build
      # — which nothing ran until a deploy. Building here rather than listing
      # the Dockerfile's commands means the check cannot drift from what deploy
      # actually does.
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          build-args: |
            VERSION=pr-${{ gitea.event.pull_request.number }}
