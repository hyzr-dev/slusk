[lidarr]
url = "http://lidarr:8686"
api_key = "CHANGEME"

[slskd]
url = "http://slskd:5030"
api_key = "CHANGEME"
# slskdarr cleans up after itself in slskd: it deletes each search once its
# responses are harvested, and removes download records once they reach a
# terminal state. As a backstop for anything left behind by a crash between
# harvest and delete, enable slskd's own retention in its config (slskd.yml),
# e.g. retention.search and retention.transfers.* (minutes).

[pipeline]
# The matcher/transfer knobs below (through min_bitrate and
# [pipeline.weights]) are mandatory, same as they were under the old [engine]
# section. Everything else in [pipeline] is optional; an absent key uses the
# default shown.
#
# Which peer backend drives the pipeline: "slskd" (the slskd daemon, default)
# or "soulseek" (the native internal/soulseek client, connecting directly to
# the Soulseek server). Setting this to "soulseek" makes the whole [slskd]
# section above optional, since nothing in the pipeline talks to it anymore -
# but a configured [soulseek] section below becomes required instead. The
# native backend is experimental while it's being tuned against production
# traffic; slskd remains the default and the safe fallback.
# backend = "slskd"
max_candidates_per_album = 5
transfer_deadline = "30m"
stall_timeout = "5m"
search_timeout = "20s"
min_bitrate = 192
# Max files handed to one candidate's peer at once. The budget is per candidate,
# so two jobs using the same peer each get their own. slskdarr records a whole
# album up front but sends only this many files at a time, releasing more as each
# finishes. Enqueuing a whole album at once can trip peers' per-user queued-
# megabyte limit and make a complete source look incomplete. Keep it low.
max_inflight_per_peer = 3
# How many times a download rejected for a transient reason (e.g. a peer's
# "Too many megabytes" queue limit) is re-queued before it is given up on.
# The file waits in the pending pool and is resent once the peer's queue drains,
# instead of failing the whole candidate. Permanent reasons ("File not shared",
# "Banned") are never retried. 0 disables retries (optional; defaults to 0).
max_transfer_retries = 3
#
# Global cap on jobs in DOWNLOADING and IMPORTING. SELECTING uses no slot.
# Default 30.
max_active = 30
# Failed search cycles allowed before a job is given up on. An empty search or
# exhausted cached set counts; candidate failures are free. Default 10.
max_retries = 10
# Base for exponential search-retry backoff. The first delay is twice this
# value. Default 15m.
backoff_base = "15m"
# Upper bound on exponential backoff growth. Default 24h.
backoff_cap = "24h"
# How long the whole cached candidate set remains eligible before it expires
# and the job resets to WANTED for a fresh search. Default 24h.
candidate_ttl = "24h"
# How long a permanently failed job waits before being revived for another
# attempt. Default 720h.
failed_revive_after = "720h"
# Maximum time an IMPORTING job may remain without progress in pre-submit
# verification due to repeated verification failures or anomalies; after that,
# the current candidate is failed and the next is tried. Default 1h.
stuck_after = "1h"
# Upper bound on a single pipeline tick's total execution time. Default 5m.
tick_timeout = "5m"
# How long an import may sit unconfirmed (Lidarr's ManualImport command is
# async) before it's treated as failed and rotated to the next candidate.
# Default 3m.
import_confirm_timeout = "3m"
# How often the wanted list is refreshed from Lidarr. Default 15m.
wanted_sync_interval = "15m"
# How often the discovery phase runs. Default 30s.
discovery_interval = "30s"
# How often the selecting phase runs. Default 10s.
selecting_interval = "10s"
# How often the downloading phase runs. Default 15s.
downloading_interval = "15s"
# How often the importing phase runs. Default 30s.
importing_interval = "30s"
# Upper bound on Lidarr's manualimport folder scan, which parses audio tags
# per file and legitimately runs far longer than a normal API call on large
# folders (box sets, deluxe editions). Default 10m.
manual_import_timeout = "10m"
# How long the importing phase waits before re-attempting a failed
# manualimport folder scan on the same job, so a slow-scanning folder is not
# hammered every importing_interval until stuck_after. Default 5m.
import_retry_cooldown = "5m"

[pipeline.weights]
format = 1.0
bitrate = 0.5
reliability = 0.8
file_count = 1.0
# Weight for a peer's decayed known-good/known-bad history (per-artist,
# falling back to global) - see internal/matcher/reliability_history.go. The
# history factor is normalized to 0..1, so this is comparable in scale to the
# other weights, not a multiplier on them.
known_user = 1.0

[store]
# PostgreSQL connection string. The schema is created automatically on startup;
# the database and user must already exist.
dsn = "postgres://slskdarr:password@postgres:5432/slskdarr?sslmode=disable"

[observ]
# /healthz, /readyz, the dashboard shell, and /api/auth/* are public. Every
# other UI, API, and metrics request needs EITHER a valid browser session
# (created by logging in through the dashboard - the first visit prompts to
# create an account) OR this token. auth_token is now OPTIONAL: it exists for
# machine/API access alongside the browser login (curl, Prometheus scraping,
# the Vite dev proxy in `make dev`), not as the only way in. Leave it blank
# to disable machine access entirely - if you have a Prometheus (or other
# non-browser) scrape already configured against /metrics, blanking this on
# an existing deployment will break it, since /metrics accepts no session
# cookie. Generate one, for example, with:
#   openssl rand -hex 32
# API and Prometheus clients send: Authorization: Bearer <token>
# Non-browser Basic-auth clients use any username and this token as the password.
# Keep the token out of URLs and logs, and terminate TLS at a trusted reverse
# proxy before exposing the listener beyond a trusted private network. The
# proxy must preserve Host, discard any client X-Forwarded-Proto header, and
# set exactly one trusted X-Forwarded-Proto value (http or https) - this also
# controls whether the session cookie is marked Secure.
auth_token = ""
listen_addr = "0.0.0.0:9090"
# Minimum log level: "debug", "info" (default), "warn", or "error". Use "debug"
# to trace the native soulseek client's peer/transfer negotiation. Verbose.
# log_level = "info"

[paths]
# When a job exhausts its retry budget, whatever it left behind here is moved
# into the ".failed" subdirectory rather than left in the root for Lidarr and
# the next job to scan. Nothing ever prunes that directory - clear it yourself.
slskd_complete_dir = "/music/slskd-downloads"

# Optional: enable a direct connection to the central Soulseek server,
# separate from the [slskd] daemon. Uncomment and fill in credentials to
# enable it; leaving the whole section absent (or every field blank) keeps
# it disabled. Once enabled, it can also drive pipeline downloads directly
# instead of slskd - see pipeline.backend above.
# [soulseek]
# server_address = "server.slsknet.org:2242"
# username = "CHANGEME"
# password = "CHANGEME"
#
# listen_addr is where slskdarr listens for incoming peer connections and is
# what gets advertised to the server after login - there is no separate
# "advertised port" concept, so other peers must be able to reach this port
# directly. With Docker port mapping, the published host port MUST equal the
# container port (e.g. "2234:2234"), or use host networking instead.
# listen_addr = "0.0.0.0:2234"
#
# Two upload slots are used by default. Negotiation and streaming both occupy
# a slot; additional requests wait in a bounded global FIFO queue.
# upload_slots = 2
#
# The central server supplies the raw IP:port slskdarr dials for each peer,
# so it is treated as untrusted input. Loopback and link-local addresses are
# always refused. RFC 1918 / ULA private addresses are refused too, unless
# you set this - needed if you actually have Soulseek peers on your own LAN.
# allow_private_peer_addresses = false
#
# Optional: run behind gluetun with VPN port forwarding. At startup slskdarr
# asks gluetun's control server for the currently forwarded port and listens
# on it instead - the port part of listen_addr above is ignored (its host is
# still used); startup waits and retries with backoff until gluetun reports a
# nonzero port. The Docker port-mapping caveat on listen_addr above does not
# apply here, since with gluetun you run slskdarr with
# network_mode: service:gluetun (see docker-compose.example.yml) rather than
# publishing a port of its own.
# [soulseek.gluetun]
# control_url = "http://127.0.0.1:8000"
# api_key = "CHANGEME"
#
# Shares use explicit public names so local host/container paths never appear
# in browse/search results. Mount each path read-only. Shares are scanned at
# startup; after adding or removing files, atomically rescan with SIGHUP or
# POST /api/shares/rescan.
# [[soulseek.shared_folders]]
# name = "Music"
# path = "/shares/music"
#
# [[soulseek.shared_folders]]
# name = "Live"
# path = "/shares/live"

# Optional: let a manual search result be identified against MusicBrainz
# before download (issue #321), showing the canonical artist/album, a
# complete-tracklist assessment against the chosen edition, and whether the
# album is already in the Lidarr library. Leaving the whole section absent
# (or every field blank) keeps it disabled and the /api/identify/* endpoints
# answer "not enabled".
#
# MusicBrainz allows one request per second and requires every client to
# identify itself with contact info in its User-Agent - contact has no
# default and is required once this section is enabled.
# [musicbrainz]
# base_url = "https://musicbrainz.org"
# contact = "you@example.com"
# timeout = "10s"
# cache_ttl = "1h"
