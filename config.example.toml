[lidarr]
url = "http://lidarr:8686"
api_key = "CHANGEME"
poll_interval = "5m"

[slskd]
url = "http://slskd:5030"
api_key = "CHANGEME"
status_poll_interval = "15s"

[engine]
max_candidates_per_album = 5
transfer_deadline = "30m"
stall_timeout = "5m"
search_timeout = "20s"
min_bitrate = 192
# Per-tick batch size used across the discovery pipeline stages (retry, start,
# top-up, downloading, verifying, importing). Not a concurrency limit: searches
# within a batch run sequentially.
batch = 4
# Global cap on jobs simultaneously active (searching through importing:
# SEARCHING/SELECTING/DOWNLOADING/VERIFYING/IMPORTING), regardless of how
# many are newly started per tick.
max_concurrent_active = 30
# Max files handed to a single peer at once. slskdarr records a candidate's whole
# album up front but only sends this many to slskd at a time, releasing more as
# each finishes. Enqueuing a whole album at once trips Soulseek peers' per-user
# queued-megabyte limit, which they answer with "Too many megabytes" rejections
# on the overflow files (a fully-capable source then looks incomplete). Keep it
# low (a handful) so the queued total stays under typical peer limits.
max_inflight_per_peer = 3
# How many times a download rejected for a transient reason (e.g. a peer's
# "Too many megabytes" queue limit) is re-queued before it is given up on.
# The file waits in the pending pool and is resent once the peer's queue drains,
# instead of failing the whole candidate. Permanent reasons ("File not shared",
# "Banned") are never retried. 0 disables retries (optional; defaults to 0).
max_transfer_retries = 3
# Wait before re-searching an album when NO untried candidate is left (nothing
# new to try soon).
candidate_backoff = "2m"
# Wait before trying the NEXT candidate after one fails to download or is rejected
# on import. Kept short: other candidates are usually available immediately, so a
# single peer timeout should not stall the album for long.
failed_candidate_backoff = "20s"
failed_retry_after = "24h"
# How long an import may sit unconfirmed in IMPORTING (Lidarr's ManualImport
# command is async) before it's treated as failed and rotated to the next
# candidate.
import_confirm_timeout = "3m"
# How often the discovery pipeline advances jobs through the state machine
# (retries, candidate starts, download/import progression). Independent of
# lidarr.poll_interval, which only controls how often the wanted list is
# refreshed from Lidarr.
tick_interval = "30s"
# Reject a candidate whose file count exceeds the album's known Lidarr track
# count by more than this multiple, e.g. 2.0 rejects a candidate offering more
# than 2x the expected tracks. Guards against a Soulseek share dumping an
# artist's whole discography into one flat folder being mistaken for a single
# album. Ignored (no rejection) when Lidarr's expected track count is unknown.
max_candidate_file_ratio = 2.0

[engine.weights]
format = 1.0
bitrate = 0.5
reliability = 0.8
file_count = 1.0
# Weight for a peer's decayed known-good/known-bad history (per-artist,
# falling back to global) - see internal/matcher/reliability_history.go. The
# history factor is normalized to 0..1, so this is comparable in scale to the
# other weights, not a multiplier on them.
known_user = 1.0

[pipeline]
# All keys below are optional; an absent [pipeline] section (or an absent
# individual key) uses the default shown. This section configures the new
# state-machine pipeline; the legacy engine above is unaffected and reads its
# own [engine] keys until it is retired.
#
# Global cap on jobs simultaneously active across the pipeline (searching
# through importing). Mirrors engine.max_concurrent_active above.
max_active = 30
# How many candidates a job cycles through before it is given up on.
max_retries = 10
# Initial wait before retrying a job with no untried candidate left.
backoff_base = "15m"
# Upper bound on exponential backoff growth.
backoff_cap = "24h"
# How long a discovered candidate stays eligible before it is dropped and
# re-discovered.
candidate_ttl = "24h"
# How long a permanently failed job waits before being revived for another
# attempt.
failed_revive_after = "720h"
# How long a job may sit without progress in an active phase before it is
# treated as stuck and reconciled.
stuck_after = "1h"
# Upper bound on a single pipeline tick's total execution time.
tick_timeout = "5m"
# How long an import may sit unconfirmed (Lidarr's ManualImport command is
# async) before it's treated as failed and rotated to the next candidate.
import_confirm_timeout = "3m"
# How often the wanted list is refreshed from Lidarr.
wanted_sync_interval = "15m"
# How often the discovery phase runs.
discovery_interval = "30s"
# How often the selecting phase runs.
selecting_interval = "10s"
# How often the downloading phase runs.
downloading_interval = "15s"
# How often the importing phase runs.
importing_interval = "30s"

[store]
# PostgreSQL connection string. The schema is created automatically on startup;
# the database and user must already exist.
dsn = "postgres://slskdarr:password@postgres:5432/slskdarr?sslmode=disable"

[observ]
listen_addr = "0.0.0.0:9090"

[paths]
slskd_complete_dir = "/music/slskd-downloads"
