[lidarr]
url = "http://lidarr:8686"
api_key = "CHANGEME"

[slskd]
url = "http://slskd:5030"
api_key = "CHANGEME"
# slskdarr cleans up after itself in slskd: it deletes each search once its
# responses are harvested, and removes download records once they reach a
# terminal state. As a backstop for anything left behind by a crash between
# harvest and delete, enable slskd's own retention in its config (slskd.yml),
# e.g. retention.search and retention.transfers.* (minutes).

[pipeline]
# The matcher/transfer knobs below (through min_bitrate and
# [pipeline.weights]) are mandatory, same as they were under the old [engine]
# section. Everything else in [pipeline] is optional; an absent key uses the
# default shown.
max_candidates_per_album = 5
transfer_deadline = "30m"
stall_timeout = "5m"
search_timeout = "20s"
min_bitrate = 192
# Max files handed to a single peer at once. slskdarr records a candidate's whole
# album up front but only sends this many to slskd at a time, releasing more as
# each finishes. Enqueuing a whole album at once trips Soulseek peers' per-user
# queued-megabyte limit, which they answer with "Too many megabytes" rejections
# on the overflow files (a fully-capable source then looks incomplete). Keep it
# low (a handful) so the queued total stays under typical peer limits.
max_inflight_per_peer = 3
# How many times a download rejected for a transient reason (e.g. a peer's
# "Too many megabytes" queue limit) is re-queued before it is given up on.
# The file waits in the pending pool and is resent once the peer's queue drains,
# instead of failing the whole candidate. Permanent reasons ("File not shared",
# "Banned") are never retried. 0 disables retries (optional; defaults to 0).
max_transfer_retries = 3
#
# Global cap on jobs simultaneously active across the pipeline
# (SELECTING/DOWNLOADING/IMPORTING), regardless of how many are newly started
# per tick. Default 30.
max_active = 30
# How many candidates a job cycles through before it is given up on. Default 10.
max_retries = 10
# Initial wait before retrying a job with no untried candidate left. Default 15m.
backoff_base = "15m"
# Upper bound on exponential backoff growth. Default 24h.
backoff_cap = "24h"
# How long a discovered candidate stays eligible before it is dropped and
# re-discovered. Default 24h.
candidate_ttl = "24h"
# How long a permanently failed job waits before being revived for another
# attempt. Default 720h.
failed_revive_after = "720h"
# How long a job may sit without progress in an active phase before it is
# treated as stuck and reconciled. Default 1h.
stuck_after = "1h"
# Upper bound on a single pipeline tick's total execution time. Default 5m.
tick_timeout = "5m"
# How long an import may sit unconfirmed (Lidarr's ManualImport command is
# async) before it's treated as failed and rotated to the next candidate.
# Default 3m.
import_confirm_timeout = "3m"
# How often the wanted list is refreshed from Lidarr. Default 15m.
wanted_sync_interval = "15m"
# How often the discovery phase runs. Default 30s.
discovery_interval = "30s"
# How often the selecting phase runs. Default 10s.
selecting_interval = "10s"
# How often the downloading phase runs. Default 15s.
downloading_interval = "15s"
# How often the importing phase runs. Default 30s.
importing_interval = "30s"

[pipeline.weights]
format = 1.0
bitrate = 0.5
reliability = 0.8
file_count = 1.0
# Weight for a peer's decayed known-good/known-bad history (per-artist,
# falling back to global) - see internal/matcher/reliability_history.go. The
# history factor is normalized to 0..1, so this is comparable in scale to the
# other weights, not a multiplier on them.
known_user = 1.0

[store]
# PostgreSQL connection string. The schema is created automatically on startup;
# the database and user must already exist.
dsn = "postgres://slskdarr:password@postgres:5432/slskdarr?sslmode=disable"

[observ]
# /healthz is public and contains only liveness. The dashboard, JSON API,
# /status, and /metrics require this token. A token is mandatory whenever the
# listener is not loopback-only. Generate one, for example, with:
#   openssl rand -hex 32
# API and Prometheus clients send: Authorization: Bearer <token>
# Browsers use HTTP Basic auth with any username and this token as the password.
# Keep the token out of URLs and logs, and terminate TLS at a trusted reverse
# proxy before exposing the listener beyond a trusted private network. The
# proxy must preserve Host, discard any client X-Forwarded-Proto header, and
# set exactly one trusted X-Forwarded-Proto value (http or https).
# Set this to a generated token before using the non-loopback listener below.
auth_token = ""
listen_addr = "0.0.0.0:9090"

[paths]
slskd_complete_dir = "/music/slskd-downloads"

# Optional: enable a direct connection to the central Soulseek server,
# separate from the [slskd] daemon. Uncomment and fill in credentials to
# enable it; leaving the whole section absent (or every field blank) keeps
# it disabled.
# [soulseek]
# server_address = "server.slsknet.org:2242"
# username = "CHANGEME"
# password = "CHANGEME"
# listen_addr = "0.0.0.0:2234"
