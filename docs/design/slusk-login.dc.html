<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{margin:0;background:#08090a;}
  ::selection{background:rgba(255,255,255,0.16);}
  input,button{font-family:inherit;}
  a{color:var(--dim);}
  a:hover{color:var(--fg);}
  @keyframes tui-pulse{0%,100%{opacity:1;}50%{opacity:.25;}}
</style>
</helmet>
<div style="{{ rootStyle }}">
  <div style="display:flex;align-items:baseline;gap:10px;">
    <span style="color:var(--fg);font-weight:600;font-size:15px;letter-spacing:1.8px;">SLUSK</span>
    <span style="color:var(--faint);font-size:10.5px;letter-spacing:0.5px;">1.0.0-rc2</span>
  </div>
  <div style="display:flex;align-items:center;gap:8px;margin-top:6px;">
    <span style="width:6px;height:6px;background:var(--ok);animation:tui-pulse 1.8s infinite;"></span>
    <span style="font-size:11px;color:var(--faint);letter-spacing:0.4px;">sign in to continue</span>
  </div>

  <form onSubmit="{{ onSubmit }}" style="border:1px solid var(--line);background:#0a0b0c;width:340px;margin-top:28px;">
    <div style="display:flex;align-items:center;gap:11px;padding:13px 17px;border-bottom:1px solid var(--line);">
      <span style="color:#4c555b;font-size:11px;">─</span>
      <span style="font-size:12.5px;color:var(--fg);letter-spacing:0.3px;">Login</span>
    </div>

    <div style="padding:18px 17px 6px;display:flex;flex-direction:column;gap:14px;">
      <label style="display:flex;flex-direction:column;gap:6px;">
        <span style="font-size:9.5px;letter-spacing:1.2px;color:#5f696f;">USERNAME</span>
        <div style="display:flex;align-items:center;gap:8px;border:1px solid var(--line2);padding:8px 10px;">
          <span style="color:var(--dim);font-size:12px;">&gt;</span>
          <input value="{{ username }}" onInput="{{ onUsername }}" placeholder="admin" style="flex:1;background:transparent;border:none;outline:none;color:var(--fg);font-size:12.5px;letter-spacing:0.3px;" />
        </div>
      </label>
      <label style="display:flex;flex-direction:column;gap:6px;">
        <span style="font-size:9.5px;letter-spacing:1.2px;color:#5f696f;">PASSWORD</span>
        <div style="display:flex;align-items:center;gap:8px;border:1px solid var(--line2);padding:8px 10px;">
          <span style="color:var(--dim);font-size:12px;">&gt;</span>
          <input type="password" value="{{ password }}" onInput="{{ onPassword }}" placeholder="••••••••" style="flex:1;background:transparent;border:none;outline:none;color:var(--fg);font-size:12.5px;letter-spacing:0.3px;" />
        </div>
      </label>
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
        <input type="checkbox" checked="{{ remember }}" onChange="{{ onRemember }}" style="accent-color:var(--dim);width:13px;height:13px;" />
        <span style="font-size:11px;color:var(--faint);letter-spacing:0.3px;">remember this session</span>
      </label>
      <sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}">
        <div style="font-size:11px;color:var(--bad);letter-spacing:0.3px;">{{ errorText }}</div>
      </sc-if>
    </div>

    <div style="display:flex;align-items:center;gap:7px;padding:17px;">
      <button type="submit" style="{{ btnPrimary }}">[↵] SIGN IN</button>
      <a href="#" style="font-size:11px;letter-spacing:0.3px;margin-left:auto;">forgot password?</a>
    </div>
  </form>

  <div style="font-size:10.5px;color:#5f696f;letter-spacing:0.4px;margin-top:18px;">slusk · lidarr companion · self-hosted</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { username: '', password: '', remember: true, error: '' };

  onUsername = (e) => this.setState({ username: e.target.value, error: '' });
  onPassword = (e) => this.setState({ password: e.target.value, error: '' });
  onRemember = (e) => this.setState({ remember: e.target.checked });

  onSubmit = (e) => {
    e.preventDefault();
    if (!this.state.username || !this.state.password) {
      this.setState({ error: 'username and password required' });
      return;
    }
    this.setState({ error: '' });
  };

  renderVals() {
    const s = this.state;
    const rootStyle = {
      '--fg':'#e8eaec','--dim':'#7d868c','--faint':'#78828a','--line':'#191d20','--line2':'#252b30',
      '--ok':'#4f9e80','--bad':'#b5595c',
      display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
      width:'100%',height:'100vh',background:'#08090a',
      fontFamily:'"IBM Plex Mono",monospace',
    };
    const btnPrimary = 'padding:7px 14px;border:1px solid var(--dim);background:#14181b;color:var(--fg);font-size:11px;letter-spacing:0.7px;cursor:pointer;';
    return {
      rootStyle, btnPrimary,
      username: s.username, onUsername: this.onUsername,
      password: s.password, onPassword: this.onPassword,
      remember: s.remember, onRemember: this.onRemember,
      hasError: !!s.error, errorText: s.error,
      onSubmit: this.onSubmit,
    };
  }
}
</script>
</body>
</html>
